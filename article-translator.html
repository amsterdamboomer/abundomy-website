<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1CoinH JSON Generator (68 Languages)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; color: #333; }
        textarea { width: 100%; height: 250px; margin-bottom: 15px; font-family: monospace; border: 1px solid #ccc; padding: 10px; }
        .controls { margin-bottom: 20px; }
        button { padding: 12px 25px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #218838; }
        pre { background: #fff; padding: 15px; border: 1px solid #ccc; overflow-x: auto; max-height: 500px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Article JSON Generator</h1>
    <p>1. Paste your HTML below. 2. Click generate. 3. Copy the JSON for your 68-language file.</p>
    
    <textarea id="htmlInput" placeholder="Paste your HTML here (the batch text)..."></textarea>
    
    <div class="controls">
        <button onclick="generateJSON()">Generate 68-Language JSON</button>
    </div>

    <h3>Resulting JSON Structure</h3>
    <pre id="jsonOutput">JSON will appear here...</pre>

    <script>
        const langCodes = ['ah', 'ar', 'am', 'az', 'by', 'be', 'bo', 'bg', 'ca', 'ch', 'cz', 'se', 'da', 'de', 'en', 'es', 'fp', 'fr', 'ir', 'gr', 'ha', 'he', 'hi', 'cr', 'ig', 'in', 'ic', 'it', 'ja', 'ka', 'kh', 'ki', 'sh', 'co', 'ko', 'kg', 'la', 'lv', 'lt', 'hu', 'mg', 'ma', 'ml', 'mo', 'bu', 'ne', 'np', 'no', 'or', 'pa', 'pe', 'po', 'pt', 'ro', 'ru', 'zi', 'al', 'sl', 'sk', 'so', 'fi', 'sw', 'ta', 'th', 'vi', 'tu', 'ur', 'yo'];

        function generateJSON() {
            const html = document.getElementById('htmlInput').value;
            // Matches id='tx_XX' and captures content until next tag closing
            const regex = /id=['"](tx_\d+)['"].*?>(.*?)<\//gs;
            let match;
            const englishContent = {};

            while ((match = regex.exec(html)) !== null) {
                const id = match[1];
                const text = match[2].trim().replace(/\s+/g, ' ');
                englishContent[id] = text;
            }

            const finalJSON = {};
            langCodes.forEach(code => {
                // Populate English with the extracted text, others as empty
                finalJSON[code] = (code === 'en') ? englishContent : {};
            });

            document.getElementById('jsonOutput').textContent = JSON.stringify(finalJSON, null, 4);
        }
    </script>
</body>
</html>
